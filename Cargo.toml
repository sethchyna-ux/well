[workspace]
resolver = "2"
members = [
    "crates/well-ipc",
    "crates/well-shell",
    "crates/well-editor",
    "crates/well-prompt",
    "crates/well-config",
    "crates/well-render",
    "crates/well-wasm",
    "crates/well-metrics",
    "crates/well-ffi",
    "crates/well-cli",
    "crates/well-llm", "crates/well-ssh", "crates/well-history", "crates/well-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Well Terminal Engineering Group"]
license = "MIT"

[workspace.dependencies]
portable-pty = "0.8"
vt100 = "0.16"
[package]
name = "well"
version = "0.1.0"
edition = "2021"

[dependencies]
well-ipc = { path = "crates/well-ipc" }
well-shell = { path = "crates/well-shell" }
well-editor = { path = "crates/well-editor" }
well-prompt = { path = "crates/well-prompt" }
well-config = { path = "crates/well-config" }
well-llm = { path = "crates/well-llm" }
well-metrics = { path = "crates/well-metrics", optional = true }
well-wasm = { path = "crates/well-wasm", optional = true }
well-render = { path = "crates/well-render" }
tokio = { version = "1.38", features = ["full"] }
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "22.0"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui-wgpu = { version = "0.29", default-features = false }
pollster = "0.3"
arboard = "3.6.1"
google-genai = "0.0.2"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls", "stream"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.21"
env_logger = "0.11.11"
vt100.workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
wasm = ["well-wasm"]
metrics = ["well-metrics"]

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
