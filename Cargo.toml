[package]
name = "well"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/well-shell",
    "crates/well-prompt",
    "crates/well-editor",
    "crates/well-render",
    "crates/well-config",
    "crates/well-ipc",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
winit = "0.30.13"
wgpu = { version = "0.20", default-features = false, features = ["hal"] }
pollster = "0.3"



[[bin]]
name = "well"
path = "src/main.rs"
