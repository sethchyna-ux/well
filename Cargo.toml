[workspace]
resolver = "2"
members = [
    "crates/well-ipc",
    "crates/well-shell",
    "crates/well-editor",
    "crates/well-prompt",
    "crates/well-config",
    "crates/well-render",
    "crates/well-wasm",
    "crates/well-metrics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Well Terminal Engineering Group"]
license = "MIT"

[workspace.dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[package]
name = "well"
version = "0.1.0"
edition = "2021"

[dependencies]
well-ipc = { path = "crates/well-ipc" }
well-shell = { path = "crates/well-shell" }
well-editor = { path = "crates/well-editor" }
well-prompt = { path = "crates/well-prompt" }
well-config = { path = "crates/well-config" }
well-render = { path = "crates/well-render" }
tokio = { version = "1.38", features = ["full"] }
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "22.0"
egui = "0.29"
egui-wgpu = { version = "0.29", default-features = false }
pollster = "0.3"
portable-pty = { workspace = true }
vt100 = { workspace = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
wasm = ["well-wasm"]
metrics = ["well-metrics"]
