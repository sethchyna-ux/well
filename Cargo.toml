[workspace]
resolver = "2"
default-members = ["crates/well-gpui"]
exclude = ["crates/well-boot"]
members = [
    "crates/well-core",
    "crates/well-ipc",
    "crates/well-shell",
    "crates/well-editor",
    "crates/well-prompt",
    "crates/well-config",
    "crates/well-render",
    "crates/well-wasm",
    "crates/well-metrics",
    "crates/well-ffi",
    "crates/well-cli",
    "crates/well-llm",
    "crates/well-ssh",
    "crates/well-history",
    "crates/well-server",
    "crates/well-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Well Terminal Engineering Group"]
license = "MIT"

[workspace.dependencies]
portable-pty = "0.8"
vt100 = "0.16"
[package]
name = "well"
version = "0.1.0"
edition = "2021"

[dependencies]
well-ipc = { path = "crates/well-ipc" }
well-shell = { path = "crates/well-shell" }
well-editor = { path = "crates/well-editor" }
well-prompt = { path = "crates/well-prompt" }
well-config = { path = "crates/well-config" }
well-llm = { path = "crates/well-llm" }
well-metrics = { path = "crates/well-metrics", optional = true }
well-wasm = { path = "crates/well-wasm", optional = true }
well-render = { path = "crates/well-render" }
tokio = { version = "1.38", features = ["full"] }
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "0.20"
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui-wgpu = { version = "0.28", default-features = false }
pollster = "0.3"
arboard = "3.6.1"
google-genai = "0.0.2"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls", "stream"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.21"
env_logger = "0.11.11"
vt100.workspace = true
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "hermes_bench"
harness = false

[[bench]]
name = "astraea_bench"
harness = false

[[bench]]
name = "metis_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
wasm = ["well-wasm"]
metrics = ["well-metrics"]

[patch.crates-io]
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", branch = "fix/future-incompat" }
block = { path = "vendor/block-0.1.6" }
