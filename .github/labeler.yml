dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.lock
          - Cargo.toml
          - '**/Cargo.toml'
          - package.json
          - package-lock.json
          - '**/package.json'
          - '**/package-lock.json'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**

rust:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.rs'
