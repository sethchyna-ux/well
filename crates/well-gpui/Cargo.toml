[package]
name = "well-gpui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "well_gpui"
path = "src/lib.rs"

[[bin]]
name = "well-gpui"
path = "src/main.rs"
test = false

[dependencies]
base64 = "0.23.1"
futures = "0.3.34"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = "0.25.10"
vt100.workspace = true
well-render = { version = "0.1.0", path = "../well-render" }
well-shell = { version = "0.1.0", path = "../well-shell" }
well-ipc = { version = "0.1.0", path = "../well-ipc" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
well-editor = { version = "0.1.0", path = "../well-editor" }
well-prompt = { version = "0.1.0", path = "../well-prompt" }
well-llm = { version = "0.1.0", path = "../well-llm" }
well-config = { version = "0.1.0", path = "../well-config" }
well-wasm = { version = "0.1.0", path = "../well-wasm" }
toml = "0.8"

well-ssh = { path = "../well-ssh" }
well-core = { path = "../well-core" }
