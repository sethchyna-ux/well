[package]
name = "well-llm"
version = "0.1.0"
edition = "2021"
authors = ["Well Terminal Engineering Group"]
license = "MIT"

[dependencies]
well-core = { path = "../well-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.10"
ureq = { version = "2.10", features = ["json", "tls"], default-features = false }
sha2 = "0.10"
base64 = "0.21"

[dev-dependencies]
image = { version = "0.25.10", features = ["png"] }

