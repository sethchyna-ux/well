[package]
name = "well-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
log = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
dashmap = "5.5"
ropey = "1.6"
winit = "0.30.13"
wgpu = { version = "0.20", default-features = false, features = ["hal"] }
pollster = "0.3"
