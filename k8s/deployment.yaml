apiVersion: v1
kind: Namespace
metadata:
  name: well-system
---
apiVersion: v1
data:
  HERMES_HOST: "0.0.0.0"
  HERMES_PORT: "9090"
  WELL_LOG_LEVEL: "info"
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: well-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hermes-runner
    app.kubernetes.io/part-of: well-terminal
  name: hermes-runner
  namespace: well-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-runner
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: hermes-config
          image: gcr.io/well-terminal/hermes-runner:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 9090
          name: hermes-runner
          ports:
            - containerPort: 9090
              name: rpc-ws
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 2
            periodSeconds: 5
            tcpSocket:
              port: 9090
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hermes-runner
  name: hermes-service
  namespace: well-system
spec:
  ports:
    - name: rpc-ws
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app.kubernetes.io/name: hermes-runner
  type: ClusterIP
